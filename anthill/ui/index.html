<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthill</title>
<!--
  The owner's view. One file, one data source: GET /api/state, every 5 s.
  To show something new: add a key in server.py state(), then a panel below
  that renders it. Everything is set with textContent -- page text comes from
  work pages anyone can edit, so none of it is ever treated as markup.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f0c; --panel: #13160f; --line: #262a1f; --ink: #e6e4da; --dim: #9a978a;
    --faint: #6b695f; --ok: #7fc8a9; --warn: #e0a15a; --bad: #e07a5f; --you: #8fb8ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13.5px/1.55 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px max(16px, 2vw) 40px; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline;
           border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  header .meta { color: var(--dim); }
  header .live { margin-left: auto; color: var(--faint); }
  header .live b { color: var(--ok); font-weight: 500; }
  .grid { display: grid; gap: 14px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1.35fr 1fr; align-items: start; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; min-width: 0; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
       margin: 0 0 8px; display: flex; gap: 8px; }
  h2 .n { color: var(--faint); }
  .row { padding: 7px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .title { font-weight: 600; }
  .sub { color: var(--dim); }
  .next::before { content: "next  "; color: var(--faint); }
  .ask::before { content: "?  "; color: var(--you); font-weight: 600; }
  .warn::before { content: "⚠  "; }
  .warn { color: var(--warn); }
  .pill { display: inline-block; font-size: 10.5px; letter-spacing: .06em; padding: 0 6px; border-radius: 3px;
          border: 1px solid currentColor; margin-left: 8px; vertical-align: 1px; }
  .s-in-progress { color: var(--ok); } .s-waiting-on-owner { color: var(--you); } .s-paused { color: var(--faint); }
  .s-ready { color: var(--ok); } .s-escalated { color: var(--bad); } .s-blocked { color: var(--faint); }
  .empty { color: var(--faint); }
  code, .path { color: var(--dim); }
  details summary { cursor: pointer; color: var(--dim); }
  details summary:focus-visible { outline: 1px solid var(--you); }
  ul { margin: 4px 0 0; padding-left: 18px; }
  li { margin: 2px 0; }
  .stat { display: flex; flex-wrap: wrap; gap: 4px 22px; }
  .stat b { color: var(--ink); font-weight: 600; }
  .err { color: var(--bad); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin-bottom: 12px; }
  .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--dim); font-size: 11.5px; }
  .tile .d { font-size: 11.5px; }
  .up { color: var(--ok); } .down { color: var(--bad); }
  table.weeks { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .weeks-box { overflow-x: auto; }
  table.weeks th { text-align: left; color: var(--faint); font-weight: 500; font-size: 11px; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.weeks td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .bar { display: inline-block; height: 8px; background: var(--you); opacity: .7; border-radius: 2px; vertical-align: middle; margin-left: 6px; }
  .note { color: var(--faint); font-size: 11.5px; margin-top: 8px; }
  .act { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .act input { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 12.5px; padding: 4px 7px; background: var(--bg);
               color: var(--ink); border: 1px solid var(--line); border-radius: 3px; }
  button.b { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 3px; cursor: pointer;
             background: transparent; color: var(--you); border: 1px solid var(--you); }
  button.b:hover { background: color-mix(in srgb, var(--you) 15%, transparent); }
  button.b.sure { color: var(--warn); border-color: var(--warn); }
  button.b:focus-visible, .act input:focus-visible { outline: 1px solid var(--you); outline-offset: 1px; }
  #toast { color: var(--ok); } #toast.bad { color: var(--bad); }
  .mode { color: var(--faint); } .mode b { color: var(--you); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="project">Anthill</h1>
    <span class="meta" id="branch"></span>
    <span class="mode" id="mode"></span>
    <span id="toast" role="status"></span>
    <span class="live" id="live">connecting…</span>
  </header>
  <section><h2>The numbers <span class="n">last 7 days · from the trail</span></h2><div id="numbers"></div></section>
  <div class="grid">
    <div class="grid" style="grid-template-columns:1fr">
      <section><h2>Waiting on you <span class="n" id="ask-n"></span></h2><div id="asks"></div></section>
      <section><h2>Work in progress <span class="n" id="work-n"></span></h2><div id="work"></div></section>
      <section><h2>Job board <span class="n" id="board-n"></span></h2><div id="board"></div></section>
    </div>
    <div class="grid" style="grid-template-columns:1fr">
      <section><h2>Being edited right now</h2><div id="editing"></div></section>
      <section><h2>Work no page describes</h2><div id="untracked"></div></section>
      <section><h2>Health</h2><div id="health"></div></section>
      <section><h2>Recent activity</h2><div id="trail"></div></section>
      <section><h2>Upkeep left undone <span class="n" id="up-n"></span></h2><div id="upkeep"></div></section>
      <section><h2>Your decisions <span class="n" id="dec-n"></span></h2><div id="decisions"></div></section>
      <section><h2>Traps</h2><div id="traps"></div></section>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);

  // The key your terminal printed, in the address after #key=. Kept for this
  // tab only, and taken out of the address bar so it is not copied by accident.
  const KEY = (() => {
    try {
      const m = location.hash.match(/key=([A-Za-z0-9_-]+)/);
      if (m) { sessionStorage.setItem("anthill-key", m[1]); history.replaceState(null, "", location.pathname); }
      return sessionStorage.getItem("anthill-key") || "";
    } catch (e) { return ""; }
  })();
  const drafts = {};            // what you are typing survives the 5-second refresh
  let sure = "";                // a sign or reopen needs a second click
  function toast(text, bad) { const t = $("toast"); t.textContent = text; t.className = bad ? "bad" : ""; setTimeout(() => { if (t.textContent === text) t.textContent = ""; }, 6000); }
  async function press(path, body) {
    try {
      const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Anthill-Key": KEY }, body: JSON.stringify(body) });
      const out = await r.json();
      if (!r.ok) { toast("✕ " + (out.error || r.status), true); return false; }
      toast("✓ done"); tick(); return true;
    } catch (e) { toast("✕ the page is not reachable", true); return false; }
  }
  function box(id, placeholder, label, onsend) {
    const wrap = el("div", "act");
    const inp = el("input"); inp.id = id; inp.placeholder = placeholder; inp.value = drafts[id] || "";
    inp.setAttribute("aria-label", placeholder);
    inp.addEventListener("input", () => { drafts[id] = inp.value; });
    const go = async () => { const v = inp.value.trim(); if (!v) return; if (await onsend(v)) { delete drafts[id]; } };
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    const b = el("button", "b", label); b.type = "button"; b.addEventListener("click", go);
    wrap.append(inp, b); return wrap;
  }
  function twice(id, label, onsend) {
    const b = el("button", "b" + (sure === id ? " sure" : ""), sure === id ? "click again to " + label.toLowerCase() : label);
    b.type = "button";
    b.addEventListener("click", async () => { if (sure !== id) { sure = id; tick(); return; } sure = ""; await onsend(); });
    return b;
  }
  function hid(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return "a" + (h >>> 0).toString(36); }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function clean(s) { return String(s || "").replace(/\*\*/g, ""); }
  function fill(id, nodes, empty) {
    const box = $(id); box.replaceChildren();
    if (!nodes.length) { box.append(el("div", "empty", empty)); return; }
    nodes.forEach((n) => box.append(n));
  }
  function row(...kids) { const r = el("div", "row"); kids.forEach((k) => k && r.append(k)); return r; }
  function pill(text, cls) { return el("span", "pill " + cls, text); }

  function render(s) {
    const w = s.where || {};
    numbers(s.score);
    $("project").textContent = s.project;
    document.title = "Anthill · " + s.project;
    $("branch").textContent = (w.branch ? "on " + w.branch : "") +
      (w.unpushed_commits ? " · " + w.unpushed_commits + " commit(s) not on GitHub" : "");

    $("mode").replaceChildren(KEY ? el("b", "", "buttons on") : document.createTextNode("view only — open the address your terminal printed to answer or sign"));
    const focused = document.activeElement && document.activeElement.id;
    const asks = [];
    // A question stays on its page until an agent acts on the answer and moves
    // it; until then show the answer, not an empty box asking again.
    const answerTo = (r, q) => {
      const key = clean(q).slice(0, 60);
      return (r.owner_answers || []).map(clean).filter((a) => a.includes("“" + key)).pop();
    };
    let answered = 0;
    (w.work || []).forEach((r) => (r.waiting_on_owner || []).forEach((q) => {
      const a = answerTo(r, q);
      const kids = [el("div", a ? "sub" : "ask", clean(q)), el("div", "sub", r.title)];
      if (a) { answered++; kids.push(el("div", "", "✓ you answered: " + a.split("”:").slice(1).join("”:").trim() + " — waiting for an agent to act on it")); }
      else if (KEY) kids.push(box(hid(r.id + q), "your answer — it goes on the work page, in your words", "Answer",
        (v) => press("/api/answer", { work: r.id, question: clean(q), answer: v })));
      asks.push(row(...kids));
    }));
    $("ask-n").textContent = asks.length ? (asks.length - answered) + (answered ? " · " + answered + " answered" : "") : "";
    fill("asks", asks, "nothing waits on you");

    const work = (w.work || []).map((r) => {
      const t = el("div", "title", r.title); t.append(pill(r.state.replace(/-/g, " "), "s-" + r.state));
      const kids = [t, r.next && el("div", "next", r.next)];
      if (r.branch) kids.push(el("div", "sub", r.branch + (r.updated ? " · updated " + r.updated : "")));
      (r.owner_answers || []).slice(-2).forEach((a) => kids.push(el("div", "sub", "you answered: " + clean(a))));
      const rel = String(r.page || "").split("knowledge/").slice(1).join("knowledge/");
      if (r.confirmed_by_owner) kids.push(el("div", "sub", "✓ signed by you"));
      else if (KEY && rel) { const a = el("div", "act"); a.append(el("span", "sub", "not signed — "), twice("sign:" + rel, "Sign this page", () => press("/api/sign", { page: rel }))); kids.push(a); }
      const d = r.drift || {};
      if (d.behind) kids.push(el("div", "warn", "page may be behind: " + d.behind.length + " commit(s) since it was true"));
      (r.broken_citations || []).forEach((c) => kids.push(el("div", "warn", "cites code that is gone: " + c)));
      return row(...kids);
    });
    $("work-n").textContent = work.length || "";
    fill("work", work, "no work page yet");

    const b = w.board || {};
    const brow = [];
    (b.ready || []).forEach((u) => brow.push(row((() => { const t = el("div", "title", u.id); t.append(pill("ready", "s-ready")); return t; })(), el("div", "sub", u.title))));
    (b.in_flight || []).forEach((u) => brow.push(row(el("div", "title", u.id + "  (in flight)"), el("div", "sub", u.title))));
    (b.escalated || []).forEach((u) => {
      const kids = [(() => { const t = el("div", "title", u.id); t.append(pill("escalated", "s-escalated")); return t; })(), el("div", "sub", "since " + (u.since || "?") + (u.why ? " · " + u.why : ""))];
      if (KEY) kids.push(box(hid("reopen" + u.id), "why it can go back on the board", "Reopen", (v) => press("/api/reopen", { unit: u.id, reason: v })));
      brow.push(row(...kids));
    });
    (b.blocked || []).forEach((u) => brow.push(row((() => { const t = el("div", "title", u.id); t.append(pill("blocked", "s-blocked")); return t; })(), el("div", "sub", u.needs && u.needs.length ? "waits on " + u.needs.join(", ") : ""))));
    (w.board_disagrees || []).forEach((d) => brow.push(row(el("div", "warn", clean(d).replace(/`/g, "")))));
    $("board-n").textContent = b.total ? b.done + " of " + b.total + " done" : "";
    fill("board", brow, b.total ? "every unit is done" : "no board in this project");

    fill("editing", (w.uncommitted || []).map((u) => row(el("div", "path", u.file), u.work && u.work.length ? el("div", "sub", u.work.join(", ")) : null)),
         "nothing uncommitted");
    fill("untracked", (w.untracked || []).map((u) => row(el("div", "title", u.branch), el("div", "sub", u.commits + " commit(s) · " + u.latest))),
         "every branch with recent work has a page");

    const m = s.map || {};
    const h = el("div", "stat");
    [["map", m.nodes !== undefined ? m.nodes + " files" : "not drawn"],
     ["drawn", m.age_min !== undefined ? (m.age_min < 60 ? m.age_min + " min ago" : Math.round(m.age_min / 60) + " h ago") : "—"],
     ["at", m.built_at || "—"]].forEach(([k, v]) => { const x = el("span", "", k + " "); x.append(el("b", "", v)); h.append(x); });
    // Each check's last run, from the trail. A crash is red: before the trail,
    // a check the hooks ran could die and nobody would ever see it.
    const tr = s.trail || {};
    const checks = (tr.checks || []).map((c) => {
      const bad = !!c.crashed;
      const r = el("div", bad ? "err" : "sub",
        (bad ? "✕ " : c.rc ? "! " : "✓ ") + c.verb + "  " + (bad ? "crashed: " + c.crashed :
         c.rc ? "exit " + c.rc + (c.verb === "blueprint" ? " (some notes are out of date)" : "") : "ok") +
        "  · " + String(c.t || "").slice(11, 16));
      return r;
    });
    const crashes = tr.crashes || [];
    if (crashes.length) checks.push(el("div", "err", crashes.length + " crash(es) in the last week — anthill trail health"));
    fill("health", [h, ...checks], "");

    fill("trail", (tr.recent || []).slice().reverse().map((e) => {
      const when = String(e.t || "").slice(11, 16);
      const who = e.tool + (e.session ? " " + e.session.slice(0, 8) : "");
      const what = e.kind === "commit" ? "commit " + e.sha + "  " + (e.subject || "") :
                   e.kind === "command" ? (e.crashed ? "CRASHED " : "") + "anthill " + (e.args || "") :
                   e.kind === "session" ? "chat " + (e.source || "startup") :
                   e.kind === "prompt" ? "you: " + (e.text || "") :
                   e.kind + " " + (e.text || "");
      return row(el("div", e.crashed ? "err" : "", when + "  " + what), el("div", "sub", who + (e.branch ? " · " + e.branch : "")));
    }), "nothing recorded yet");

    $("up-n").textContent = (s.upkeep || []).length || "";
    const up = (s.upkeep || []);
    if (up.length) {
      const d = el("details"); d.append(el("summary", "", up.length + " item(s) — the keeper clears these after commits"));
      const ul = el("ul"); up.forEach((i) => ul.append(el("li", "", i.kind + ": " + i.detail))); d.append(ul);
      fill("upkeep", [d], "");
    } else fill("upkeep", [], "nothing left undone");

    $("dec-n").textContent = (w.decisions || []).length || "";
    fill("decisions", (w.decisions || []).map((d) => row(el("div", "", d.title), el("div", "sub", d.decided || ""))), "none recorded");
    // Folded by the work they belong to: a long list of traps buried the page.
    // The ones that apply everywhere stay open.
    const byWork = {};
    (w.traps || []).forEach((t) => (byWork[t.work] = byWork[t.work] || []).push(t.trap));
    if (focused && $(focused)) { const f = $(focused); f.focus(); const n = f.value.length; try { f.setSelectionRange(n, n); } catch (e) {} }
    fill("traps", Object.keys(byWork).sort((a, b) => (a === "everywhere" ? -1 : b === "everywhere" ? 1 : a.localeCompare(b))).map((k) => {
      const d = el("details"); if (k === "everywhere") d.open = true;
      d.append(el("summary", "", k + " (" + byWork[k].length + ")"));
      const ul = el("ul"); byWork[k].forEach((t) => ul.append(el("li", "", clean(t).replace(/`/g, "")))); d.append(ul);
      return row(d);
    }), "none recorded");
  }

  // The numbers. Lower is better for both headline figures: fewer messages
  // from the owner per saved change, and less time from asking to saved.
  function numbers(sc) {
    if (!sc || sc.error || !sc.weekly) { fill("numbers", [], sc && sc.error ? "could not read the trail: " + sc.error : "no trail yet — anthill score import reads your saved chats"); return; }
    const wk = sc.weekly, last = wk[wk.length - 1] || {}, prev = wk[wk.length - 2] || {};
    function tile(v, k, now, before, unit) {
      const t = el("div", "tile");
      t.append(el("div", "v", v === null || v === undefined ? "—" : v + (unit || "")), el("div", "k", k));
      if (now != null && before != null && before !== 0) {
        const better = now < before, same = now === before;
        t.append(el("div", "d " + (same ? "" : better ? "up" : "down"),
          (same ? "same as" : (better ? "▼ " : "▲ ") + Math.abs(Math.round((now - before) / before * 100)) + "% vs") + " the week before"));
      }
      return t;
    }
    const tiles = el("div", "tiles");
    tiles.append(
      tile(sc.asked_to_saved_median_min, "from your message to a saved change (median)", last.asked_to_saved_median_min, prev.asked_to_saved_median_min, " min"),
      tile(sc.messages_per_commit, "your messages per saved change", last.messages_per_commit, prev.messages_per_commit),
      tile(sc.chats, "chats"), tile(sc.commits, "saved changes"),
      tile(sc.compressions, "chats picked up after memory was compressed"),
      tile(sc.crashes, "Anthill crashes"),
      tile(sc.corrections, "notes found wrong and corrected"));
    const box = el("div", "weeks-box"), tb = el("table", "weeks");
    const hr = el("tr"); ["week", "chats", "your messages", "saved changes", "messages per change", "message → saved", "Anthill used"].forEach((h) => hr.append(el("th", "", h)));
    tb.append(hr);
    const maxW = Math.max(1, ...wk.map((w) => w.asked_to_saved_median_min || 0));
    wk.forEach((w) => {
      const r = el("tr");
      r.append(el("td", "", w.from.slice(5) + " → " + w.to.slice(5)), el("td", "", w.chats), el("td", "", w.owner_messages),
               el("td", "", w.commits), el("td", "", w.messages_per_commit ?? "—"));
      const c = el("td", "", (w.asked_to_saved_median_min ?? "—") + (w.asked_to_saved_median_min != null ? " min" : ""));
      if (w.asked_to_saved_median_min) { const b = el("span", "bar"); b.style.width = Math.round(60 * w.asked_to_saved_median_min / maxW) + "px"; c.append(b); }
      r.append(c, el("td", "", w.anthill_uses));
      tb.append(r);
    });
    box.append(tb);
    const used = Object.entries(sc.anthill_usage || {}).slice(0, 8).map(([k, v]) => k + " " + v).join(" · ");
    const kids = [tiles, box, el("div", "note", "Anthill parts used this week: " + (used || "none"))];
    (sc.corrected || []).slice().reverse().forEach((c) => kids.push(el("div", "note",
      "corrected " + String(c.t || "").slice(5, 10) + " · " + c.page + ": was “" + c.was + "” → now “" + c.now + "”" + (c.why ? " (" + c.why + ")" : ""))));
    if (sc.imported_share > 0.5) kids.push(el("div", "note", "Mostly read from your saved Claude chats and git history (the live trail began on 29 Sep). Chat starts, compressions and notes are recorded live from now on."));
    fill("numbers", kids, "");
  }

  async function tick() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
      const t = new Date();
      $("live").replaceChildren(el("b", "", "● live"), document.createTextNode("  " + t.toLocaleTimeString()));
    } catch (e) {
      $("live").replaceChildren(el("span", "err", "● not reachable — is anthill ui still running?"));
    }
  }
  tick();
  setInterval(tick, 5000);
</script>
</body>
</html>
